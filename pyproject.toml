[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picix-keeper"
version = "0.1.0"
description = "Config-driven daily task keeper using pure HTTP requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "loguru>=0.7,<1",
  "requests>=2.32,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.1,<7",
  "typer>=0.12,<1",
]

[project.scripts]
picix-keeper = "picix_keeper.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["picix_keeper*"]
